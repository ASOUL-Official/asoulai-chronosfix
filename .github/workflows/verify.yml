name: Verify ChronosFix

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-gate:
    name: Python ${{ matrix.python-version }} engineering gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[validation]"

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce Golden and Badcase evaluation
        run: >-
          chronosfix-evaluate
          --scenarios scenarios
          --output "${{ runner.temp }}/chronosfix-evaluation"

      - name: Validate repository JSON and JSONL
        run: python scripts/validate_json_artifacts.py .

      - name: Validate AgentTeams declarations without deploying them
        run: >-
          python agentteams/runtime/validate_resources.py
          agentteams/runtime/chronosfix-resources.yaml
          --output "${{ runner.temp }}/agentteams-manifest-validation.json"

      - name: Run complete semifinal acceptance chain
        run: >-
          python scripts/run_semifinal_acceptance.py
          --output "${{ runner.temp }}/chronosfix-semifinal-acceptance"

      - name: Upload semifinal acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronosfix-semifinal-acceptance-${{ matrix.python-version }}
          path: ${{ runner.temp }}/chronosfix-semifinal-acceptance/
          if-no-files-found: error

      - name: Verify tests did not mutate tracked evidence
        run: git diff --exit-code -- .
